# The pull request workflow of {{Repository}}. It runs the shared AI-SDLC checks from the core, through
# the composite action that apm install puts under .claude/: the installed files match apm.lock.yaml,
# the gitleaks secret scan runs, and every gate runs. A blocking gate fails the run and an advisory one
# warns. A .NET repository first runs its tests with coverage, and the action reads the merged coverage
# for the C04 coverage ratchet. Add other build and test jobs of this repository next to this one.
# A ruleset on {{Trunk}} makes the check required: run Set-BranchRuleset.ps1 of the github pack once.
name: pr

on:
  pull_request:
    branches:
      - {{Trunk}}

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-sdlc:
    name: AI-SDLC gates
    runs-on: {{Runner}}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

{{TestSteps}}      - uses: ./.claude/skills/ai-sdlc-gates/assets/actions/ai-sdlc-pr
        with:
          private-terms: ${{ secrets.AISDLC_PRIVATE_TERMS }}{{ActionInputs}}
